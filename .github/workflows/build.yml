name: build-and-publish

on:
  schedule:
    # Every 6 hours. Adjust as desired; GitHub may delay scheduled runs by a few minutes.
    - cron: "0 */6 * * *"
  workflow_dispatch:  # Manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write  # Needed to push to gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build ICS feeds
        run: python build_ics.py
        env:
          OUTPUT_DIR: public

      - name: Add index.html for discoverability
        run: |
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Gracie Elite Timetables</title>
          <style>body{font-family:system-ui;max-width:640px;margin:2em auto;padding:0 1em;line-height:1.5}</style>
          </head><body>
          <h1>Gracie Elite Class Calendars</h1>
          <p>Subscribe in Google Calendar via "Other calendars &rarr; From URL":</p>
          <ul>
            <li><a href="erina.ics">Erina (graciecentralcoast.com.au)</a></li>
            <li><a href="peninsula.ics">Peninsula (gracieelitethepeninsula.com.au)</a></li>
          </ul>
          <p>Feeds re-scrape every 6 hours. Google polls subscribed feeds roughly every 8&ndash;24 hours.</p>
          </body></html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
